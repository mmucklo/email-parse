name: CI

on:
  push:
    branches: [ main, master, develop, 'backport/3.x-php7.1' ]
  pull_request:
    branches: [ main, master, develop, 'backport/3.x-php7.1' ]

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # This build targets PHP 7.1-8.0 (8.1+ users get the native 3.x line).
        php-version:
          - '7.1'
          - '7.2'
          - '7.3'
          - '7.4'
          - '8.0'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, intl
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php-version }}-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.php-version }}-

      # The dev tooling (php-cs-fixer, phpstan, rector) requires PHP 8.x; the test
      # job only needs phpunit + symfony/yaml. Drop the 8.x-only tools so the suite
      # installs and runs on every supported PHP version (7.1 through 8.4).
      - name: Install dependencies
        run: |
          composer remove --dev --no-update friendsofphp/php-cs-fixer phpstan/phpstan rector/rector
          composer install --prefer-dist --no-progress

      - name: Run test suite
        run: bin/phpunit

  code-style:
    name: Code Style (PHP CS Fixer)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl
          coverage: none
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --ignore-platform-req=php
      - name: Run PHP CS Fixer
        run: bin/php-cs-fixer fix --dry-run --diff --verbose

  static-analysis:
    name: Static Analysis (PHPStan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl
          coverage: none
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --ignore-platform-req=php
      - name: Run PHPStan
        run: bin/phpstan analyse --memory-limit=512M --error-format=github
